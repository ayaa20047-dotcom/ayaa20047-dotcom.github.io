<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fdfbf7"><meta name="description" content="قصص وأدعية وأنشطة إسلامية للأطفال"><meta property="og:title" content="موسوعة الطفل المسلم"><meta property="og:description" content="قصص وأدعية وأنشطة إسلامية للأطفال"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2715%27 fill=%27%23ffe3a3%27/%3E%3Cpath d=%27M20 6a10 10 0 1 0 0 20 8 8 0 1 1 0-20z%27 fill=%27%23e8903a%27/%3E%3C/svg%3E"><title>موسوعة الطفل المسلم</title><link rel="stylesheet" href="main.css?v=v15-2"><style>html{color-scheme:light;background:#fdfbf7}body{margin:0;background:#fdfbf7;color:#5a3410;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.load-screen{min-height:100vh;min-height:100svh;display:grid;place-content:center;justify-items:center;gap:14px;padding:24px;text-align:center;box-sizing:border-box}.load-mark{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#fff0c4;font-size:28px}.load-spin{width:22px;height:22px;border:3px solid #f0d9a0;border-top-color:#e8903a;border-radius:50%;animation:spin .8s linear infinite}.load-title{font-size:22px;font-weight:800}.load-text{color:#765d48;line-height:1.7}#load-error{display:none;margin-top:6px;padding:12px 16px;border-radius:14px;background:#fff1cf;color:#5a3410}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.load-spin{animation:none;border-top-color:#e8903a}}</style></head><body><div id="root"><main class="load-screen" role="status" aria-live="polite"><div class="load-mark" aria-hidden="true">🌙</div><div class="load-title">موسوعة الطفل المسلم</div><div class="load-spin" aria-hidden="true"></div><div class="load-text">جاري تجهيز الحكايات الجميلة…<br>قد يستغرق التحميل لحظات على الإنترنت البطيء.</div><div id="load-error" role="alert">تعذر تحميل الصفحة. تأكد من الاتصال ثم أعد تحميلها. <button type="button" onclick="location.reload()" style="margin-inline-start:8px;padding:8px 14px;border:0;border-radius:12px;background:#e8903a;color:#fff;font:inherit;font-weight:700">أعد المحاولة</button></div></main></div><script>function showLoadError(){var r=document.getElementById("root"),e=document.getElementById("load-error");if(r&&r.querySelector(".load-screen")&&e)e.style.display="block"}window.addEventListener("error",showLoadError);window.addEventListener("unhandledrejection",showLoadError);setTimeout(showLoadError,60000)</script><script defer src="main.js?v=v15-2" onerror="showLoadError()"></script></body></html>
